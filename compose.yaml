services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ariops
      POSTGRES_USER: ariops
      POSTGRES_PASSWORD: ariops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ariops -d ariops"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    command: >
      sh -c "alembic upgrade head && uvicorn ariops.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      database:
        condition: service_healthy
    environment:
      ARIOPS_DATABASE_URL: postgresql+psycopg://ariops:ariops@database:5432/ariops
    ports:
      - "8000:8000"

volumes:
  postgres-data:
